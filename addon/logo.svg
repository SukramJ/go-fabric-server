     The add-on logo: the icon and the name. The wordmark is a system
     sans-serif at render time (Helvetica Neue on macOS).
     Render: rsvg-convert -w 500 -h 140 addon/logo.svg -o addon/logo.png -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2cb6a3"/>
      <stop offset="1" stop-color="#0e7f73"/>
    </linearGradient>
  </defs>
  <rect width="500" height="140" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="498" height="138" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <!-- the icon's glyph, scaled 0.45 into a 116px tile at (12,12) -->
  <g transform="translate(12 12) scale(0.453125)">
    <g fill="#ffffff">
      <rect x="30" y="84" width="74" height="30" rx="9"/>
      <rect x="30" y="128" width="74" height="30" rx="9"/>
    </g>
    <g fill="#0e7f73">
      <circle cx="48" cy="99" r="6"/>
      <circle cx="48" cy="143" r="6"/>
    </g>
    <g stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none">
      <path d="M124 104h96"/>
      <path d="M116 136h104"/>
      <path d="M124 168h96"/>
    </g>
    <circle cx="184" cy="136" r="22" fill="#ffffff"/>
    <circle cx="184" cy="136" r="9" fill="#0e7f73"/>
  </g>
  <text x="140" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff">go-fabric-server</text>
  <text x="142" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" fill-opacity="0.85">Matter controller server for Home Assistant</text>
</svg>

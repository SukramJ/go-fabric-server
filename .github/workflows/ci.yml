# GitHub Actions CI for go-fabric-server, the form of the sibling
# repositories (go-fabric, go-zendure2mqtt, go-ha2fabric): lint (go vet +
# gofumpt + golangci-lint + go.mod tidiness), security (govulncheck +
# go-licenses + the gitleaks history scan), test (the OS triplet, race
# detector on), coverage (the per-package floors), fuzz-smoke (the JSON
# decoders and paths), build (the daemon, the image, the release matrix).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.27.3"
  # Pinned, not @latest: a tool release must not turn an unrelated pull
  # request red. Keep in step with `make setup`.
  GOFUMPT_VERSION: "v0.12.0"
  GOLANGCI_LINT_VERSION: "v2.14.0"
  GOVULNCHECK_VERSION: "v1.8.0"
  GOLICENSES_VERSION: "v1.6.0"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@${{ env.GOFUMPT_VERSION }}
          make fmt-check
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          golangci-lint config verify
          golangci-lint run --timeout=5m ./...
      - name: go.mod tidiness
        run: make tidy-check

  security:
    name: security (vuln + licenses + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          make vuln
      - name: go-licenses
        run: |
          go install github.com/google/go-licenses@${{ env.GOLICENSES_VERSION }}
          make licenses
      - name: gitleaks
        run: make secrets

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout=600s ./...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: cover-check
        run: make cover-check

  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: fuzz-smoke
        run: make fuzz-smoke FUZZTIME=20000x

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build
        run: make build
      - name: the daemon starts
        run: ./bin/fabric-server --version
      - name: generated schema is current
        run: |
          go run ./internal/gen
          git diff --exit-code -- protocol/schema
      - name: release matrix (dry run)
        run: make release
      - name: image
        run: docker build -f deploy/Dockerfile -t go-fabric-server:ci .
